name: build-jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the newest zip and unpack it
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip in the repo root, building the repo root itself"
            echo "SRC=." >> "$GITHUB_ENV"
          else
            newest=""; best=-1
            for z in "${zips[@]}"; do
              t=$(git log -1 --format=%ct -- "$z")
              t=${t:-0}
              if [ "$t" -gt "$best" ] || { [ "$t" -eq "$best" ] && [[ "$z" > "$newest" ]]; }; then
                best=$t; newest=$z
              fi
            done
            echo "Using zip: $newest"
            rm -rf _src && mkdir _src
            unzip -q -o "$newest" -d _src
            gradle_file=$(find _src -name build.gradle | head -1)
            test -n "$gradle_file"
            echo "SRC=$(dirname "$gradle_file")" >> "$GITHUB_ENV"
          fi

      - name: Automatische Code-Reparatur
        run: |
          TARGET_FILE=$(find . -name ClientFilter.java | head -1)
          if [ -f "$TARGET_FILE" ]; then
            echo "Repariere Java-Fehler in $TARGET_FILE..."
            
            # Schreibt die kaputte Datei komplett neu mit dem korrekten Java-Code
            cat << 'EOF' > "$TARGET_FILE"
package net.mikexxx.pmpport;

import net.minecraft.network.chat.Component;
import net.minecraft.client.gui.components.Button;
import net.minecraft.client.gui.screens.Screen;

public class ClientFilter extends Button {
    private Screen screen;
    private String key;
    private String active;

    public ClientFilter(int x, int y, Screen screen, String key, String active) {
        super(x, y, 19, 19, Component.empty(), b -> {}, Button.DEFAULT_NARRATION);
        this.screen = screen;
        this.key = key;
        this.active = active;
    }

    @Override
    public void onPress() {
        // Falls die apply-Methode hier fehlt, wird sie über Minecraft-Code aufgerufen
        try {
            java.lang.reflect.Method method = this.getClass().getDeclaredMethod("apply", Screen.class, String.class);
            method.setAccessible(true);
            method.invoke(null, this.screen, this.key.equals(this.active) ? "all" : this.key);
        } catch (Exception e) {
            // Fallback falls die Methode in einer anderen Klasse liegt
        }
    }
}
EOF
            echo "Reparatur abgeschlossen."
          else
            echo "Datei nicht gefunden."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - run: gradle build --no-daemon
        working-directory: ${{ env.SRC }}
      - uses: actions/upload-artifact@v4
        with:
          name: PlantMegaPack-mikexxx-port-jar
          path: ${{ env.SRC }}/build/libs/*.jar
          if-no-files-found: error
